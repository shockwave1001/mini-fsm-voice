<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com wss://api.elevenlabs.io wss://api.deepgram.com; media-src 'self' blob:; base-uri 'none'; form-action 'none'">
<title>Mini FSM Voice</title>
<link rel="stylesheet" href="voice.css">
</head>
<body>
<main>
  <header>
    <div class="mark">M</div>
    <div class="who"><b id="title">Voice</b><span id="client"></span></div>
  </header>
  <p class="status" id="status" role="status">Opening this visit…</p>
  <p class="tr" id="tr" hidden aria-live="polite"></p>
  <p class="note" id="note" hidden role="status"></p>
  <section class="ask" id="ask"><b class="q" id="q"></b><button type="button" class="ghost" id="skip">Skip</button></section>
  <section class="conf" id="conf" hidden><b id="confT"></b><div class="two"><button type="button" class="yes" id="yes">Yes</button><button type="button" class="no" id="no">No</button></div></section>
  <div class="chips" id="chips" hidden></div>
  <div class="fieldsBox" id="infoBox" hidden><ul id="info"></ul></div>
  <div class="fieldsBox" id="fieldsBox" hidden><ul id="fields"></ul></div>
</main>
<footer>
  <button type="button" class="talk" id="talk" aria-pressed="false" aria-label="Talk. Tap to start or stop, hold to push to talk"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg><span id="talkT">Talk</span></button>
  <button type="button" class="mute" id="mute" aria-pressed="false" aria-label="Mute the voice">🔊</button>
</footer>
<script src="voice-io.js"></script>
<script src="voice.js"></script>
</body>
</html>
